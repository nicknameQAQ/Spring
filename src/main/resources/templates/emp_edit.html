<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>编辑员工</title>
</head>
<body>
<h2>编辑员工</h2>

<form th:action="@{/save}" method="post">
    员工编号：
    <input name="empno" th:value="${emp.empno}" readonly><br><br>
    姓名：
    <input name="ename" th:value="${emp.ename}" required><br><br>
    入职日期：
    <input name="hiredate" th:value="${emp.hiredate}" required><br><br>
    工资：
    <input name="sal" type="number" step="0.01" th:value="${emp.sal}" required><br><br>
    <button type="submit">保存修改</button>
    <a th:href="@{/list}">返回</a>
</form>
</body>
</html>
